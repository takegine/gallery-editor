name: 三平台打包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-2022 ]
        # os: [ubuntu-22.04, windows-2022, macos-14]
        include:
          # - os: ubuntu-22.04
          #   artifact_name: linux-build
          #   enabled: false
          - os: windows-2022
            artifact_name: windows-build
            # enabled: true
          # - os: macos-14
          #   artifact_name: macos-build
          #   enabled: false

    steps:    
    - name: 安装 Tauri 依赖
      if: matrix.os == 'ubuntu-22.04' || runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libappindicator3-dev \
          patchelf
    - name: Checkout main repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 安装 SSH 密钥
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}


    - name: 配置 Git 禁用主机密钥验证
      run: |
        # 配置 Git 全局禁用 SSH 主机密钥验证
        git config --global core.sshCommand "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        echo "Git SSH 配置已更新"
        # 强制子模块使用 SSH 协议
        # git config --global url."git@e.coding.net:".insteadOf "https://e.coding.net/"
        
        # 初始化并更新子模块
        git submodule update --init --recursive --jobs 4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'

    - name: 安装 pnpm
      run: npm install -g pnpm@8
    
    - name: 安装依赖
      run: pnpm install
      working-directory: app
      
    - name: 构建应用
      run: pnpm build
      working-directory: app
      env:
        NODE_ENV: production

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: app/src-tauri/target/release/bundle
        retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: build-matrix
    permissions:
      contents: write
    
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-artifacts

      - name: 检查下载的文件
        run: |
          echo "准备发布的文件:"
          find dist-artifacts -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage"

      - name: 确定 Release 标签
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "使用标签: ${{ github.ref }}"
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "使用手动构建标签"
            echo "tag=v0.0.0-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "name=Manual Build ${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist-artifacts/**/*
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.name }}
          draft: false
          prerelease: false
          body: |
            自动构建的发布版本
            构建 ID: ${{ github.run_id }}
            触发方式: ${{ github.event_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}