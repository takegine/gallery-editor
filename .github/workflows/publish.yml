name: 三平台打包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        include:
          - os: ubuntu-22.04
            artifact_name: linux-build
          - os: windows-2022
            artifact_name: windows-build
          - os: macos-14
            artifact_name: macos-build

    steps:
    - name: Checkout main repository (含子模块)
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
        token: ${{ secrets.GH_PAT }}

    - name: 缓存 Rust 编译产物
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src-tauri

    - name: 安装 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: 安装 pnpm
      run: npm install -g pnpm@9

    - name: 安装 Tauri 依赖
      if: matrix.os == 'ubuntu-22.04' || runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libayatana-appindicator3-dev \
          patchelf

    - name: 设置 Python 3.11 (macOS 14 默认 Python 3.14 已移除 distutils)
      if: matrix.os == 'macos-14'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: pnpm install
      working-directory: app

    - name: 构建应用
      run: pnpm build
      working-directory: app
      env:
        NODE_ENV: production

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: app/src-tauri/target/release/bundle
        retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: build-matrix
    permissions:
      contents: write
    
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: dist-artifacts
          merge-multiple: true

      - name: 检查下载的文件
        run: |
          echo "准备发布的文件:"
          find dist-artifacts -type f

      - name: 确定 Release 标签
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "使用标签: ${{ github.ref }}"
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "使用手动构建标签"
            echo "tag=v0.0.0-manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "name=Manual Build ${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.msi
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.rpm
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.name }}
          draft: false
          prerelease: false
          body: |
            自动构建的发布版本
            构建 ID: ${{ github.run_id }}
            触发方式: ${{ github.event_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}